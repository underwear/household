<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">
  <!-- README hero: a static frame of the landing page demo — the Ops bot's night, in its Telegram thread. -->
  <defs>
    <clipPath id="win"><rect width="860" height="520" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="860" height="520" fill="#f7f5f0"/>

    <!-- header -->
    <rect width="860" height="56" fill="#1f1d1a"/>
    <circle cx="24" cy="28" r="6" fill="#e5534b"/>
    <circle cx="44" cy="28" r="6" fill="#e0b341"/>
    <circle cx="64" cy="28" r="6" fill="#72c191"/>
    <g transform="translate(96 12)">
      <rect width="210" height="32" rx="16" fill="#2c2925"/>
      <text x="14" y="21" fill="#a8a29a">🦉  <tspan font-weight="600" fill="#d8d3ca">Assistant</tspan>  ·  everyday tasks</text>
    </g>
    <g transform="translate(318 12)">
      <rect width="250" height="32" rx="16" fill="#f2f0eb"/>
      <text x="14" y="21" fill="#6b655c">🛠️  <tspan font-weight="600" fill="#1f1d1a">Ops</tspan>  ·  watching the servers</text>
      <circle cx="234" cy="16" r="4.5" fill="#72c191"/>
    </g>

    <!-- 1. alert firing -->
    <g transform="translate(24 76)">
      <rect width="372" height="46" rx="12" fill="#fffdf8" stroke="#efebe3"/>
      <circle cx="23" cy="23" r="11" fill="#f46800"/>
      <circle cx="23" cy="23" r="5.5" fill="none" stroke="#fff" stroke-width="2.2"/>
      <text x="44" y="28" fill="#1f1d1a"><tspan font-weight="600">Grafana</tspan>  api-2 · disk 97%</text>
      <polyline points="232,32 246,31 258,30 270,26 282,16 294,13 306,12" fill="none" stroke="#e5534b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="314" y="13" width="48" height="20" rx="10" fill="#fbe3e1"/>
      <text x="338" y="27" text-anchor="middle" font-size="11" font-weight="600" fill="#e5534b">FIRING</text>
    </g>

    <!-- 2. bot -->
    <g transform="translate(24 134)">
      <rect width="262" height="38" rx="14" fill="#fffdf8" stroke="#efebe3"/>
      <text x="16" y="24" fill="#1f1d1a">Up before you. api-2 is out of disk.</text>
    </g>

    <!-- 3. cmd -->
    <g transform="translate(24 184)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <rect width="306" height="30" rx="8" fill="#1f1d1a"/>
      <text x="14" y="20" fill="#72c191">$ <tspan fill="#f2f0eb">du -sh /var/log/app  →  41G</tspan></text>
    </g>

    <!-- 4. bot -->
    <g transform="translate(24 226)">
      <rect width="478" height="38" rx="14" fill="#fffdf8" stroke="#efebe3"/>
      <text x="16" y="24" fill="#1f1d1a">Logs grew 41 GB overnight. Rotating them and restarting the API.</text>
    </g>

    <!-- 5. cmd -->
    <g transform="translate(24 276)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <rect width="226" height="30" rx="8" fill="#1f1d1a"/>
      <text x="14" y="20" fill="#72c191">$ <tspan fill="#f2f0eb">systemctl restart api</tspan></text>
    </g>

    <!-- 6. alert resolved -->
    <g transform="translate(24 318)">
      <rect width="372" height="46" rx="12" fill="#fffdf8" stroke="#efebe3"/>
      <circle cx="23" cy="23" r="11" fill="#f46800"/>
      <circle cx="23" cy="23" r="5.5" fill="none" stroke="#fff" stroke-width="2.2"/>
      <text x="44" y="28" fill="#1f1d1a"><tspan font-weight="600">Grafana</tspan>  api-2 · disk 31%</text>
      <polyline points="232,12 246,13 258,16 270,24 282,31 294,32 306,32" fill="none" stroke="#72c191" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="314" y="13" width="48" height="20" rx="10" fill="#eef6f0"/>
      <text x="338" y="27" text-anchor="middle" font-size="11" font-weight="600" fill="#3f9a63">OK</text>
    </g>

    <!-- 7. me -->
    <g transform="translate(608 384)">
      <rect width="228" height="38" rx="14" fill="#1f1d1a"/>
      <text x="16" y="24" fill="#f2f0eb">Morning. Anything happen?</text>
    </g>

    <!-- 8. bot -->
    <g transform="translate(24 434)">
      <rect width="532" height="60" rx="14" fill="#fffdf8" stroke="#efebe3"/>
      <text x="16" y="25" fill="#1f1d1a">A small fire at 3 am. Put it out, wrote the postmortem, opened a PR</text>
      <text x="16" y="45" fill="#1f1d1a">that caps the log size. You slept through it, as planned.</text>
    </g>
  </g>
</svg>
