name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["landing/**", ".github/workflows/landing.yml"]
  pull_request:
    paths-ignore: ["landing/**", ".github/workflows/landing.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile --cwd web
      - run: bunx tsc --noEmit
      - run: bun test

  claude-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Build the pinned Claude image
        run: docker build --tag household-qa-claude:ci src/agent-adapters/claude-code-tmux
      - name: Exercise real Claude and tmux without credentials or external networking
        run: bun test test/agent-adapters/claude-tmux-native.test.ts
        env:
          E2E_CLAUDE_TMUX: "1"
          CLAUDE_QA_IMAGE: household-qa-claude:ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: claude-terminal-fixture
          path: /tmp/household-qa-native-artifacts/
