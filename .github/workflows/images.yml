name: Images

# The agents' images of a release, for arm64 and amd64, at ghcr.io/underwear/household-agent-<agent>:<tag>: what
# Household pulls (src/app/agent-images.ts) instead of building them with Docker. Run by the release, or by hand for
# a tag that has none yet.

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/underwear

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        agent: [claude-code-tmux, codex-app-server]
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # One plain manifest per arch (no attestations): microsandbox pulls the image index's entry for its platform.
      - uses: docker/build-push-action@v6
        with:
          context: src/agent-adapters/${{ matrix.agent }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          push: true
          tags: ${{ env.REGISTRY }}/household-agent-${{ matrix.agent }}:${{ inputs.tag }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  merge:
    needs: build
    strategy:
      matrix:
        agent: [claude-code-tmux, codex-app-server]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: One tag for both architectures
        run: |
          image="$REGISTRY/household-agent-${{ matrix.agent }}:${{ inputs.tag }}"
          docker buildx imagetools create --tag "$image" "$image-amd64" "$image-arm64"
          docker buildx imagetools inspect "$image"
